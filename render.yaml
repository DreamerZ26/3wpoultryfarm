services:
  - type: web
    name: django-modern-site
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn mysite.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "your-app.onrender.com,localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
    autoDeploy: true

databases:
  - name: django-db
    plan: free